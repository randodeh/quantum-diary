# Render blueprint: one free Python web service. Set MOTH_API_KEY in the Render dashboard (never in code).
services:
  - type: web
    name: quantum-diary
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MOTH_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
